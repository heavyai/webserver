version: '3.7'

services:
  heavydb_stack:
    container_name: heavydb_stack
    build:
      dockerfile: Dockerfile.local
      context: .
    ports:
      - 6273:6273
      - 6274:6274
      - 6278:6278
      - 6276:6276 # Binary Thrift Port
    volumes:
      - ./storage:/var/lib/heavyai/storage
