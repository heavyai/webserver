#
# The default server
#
server {
	listen       80;
	server_name  frontend.builds.mapd.com fe.builds.mapd.com;
        access_log  /var/log/nginx/frontend.builds.mapd.com.access.log  main;
	location / {
		root   /theHoard/export/home/www/frontend.builds.mapd.com;
		index  index.html index.htm;
		error_page 404 = /index.html;
		autoindex on;

		sub_filter_last_modified on;
		sub_filter_once on;
		sub_filter '<body id="immerse-body">' '<body id="immerse-body"><script>window.APP_CONFIG = [{"username":"mapd","password":"HyperInteractive","port":10043,"protocol":"https","host":"mahakali.mapd.com","database":"mapd","master":true,"table":"tweets_nov_feb","GTM":"GTM-MDD888","mapboxCustomStyles":[{"label":"custom-mapbox-style","value":"mapbox://styles/mapd/cjb5nmfi50lyw2sqnlyee3sb4"},{"label":"osm","value":{"version":8,"sources":{"openstreetmap":{"type":"raster","tiles":["http://a.tile.openstreetmap.org/{z}/{x}/{y}.png","http://b.tile.openstreetmap.org/{z}/{x}/{y}.png"],"tileSize":256}},"layers":[{"id":"openstreetmap","type":"raster","source":"openstreetmap","minzoom":0,"maxzoom":22}]}}]}] </script>';

		if ($request_method = 'OPTIONS') {
			add_header 'Access-Control-Allow-Origin' '*';
			add_header 'Access-Control-Allow-Credentials' 'true';
			add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
			add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
			add_header 'Access-Control-Max-Age' 1728000;
			add_header 'Content-Type' 'text/plain charset=UTF-8';
			add_header 'Content-Length' 0;
			return 204;
		}
		if ($request_method = 'POST') {
			add_header 'Access-Control-Allow-Origin' '*';
			add_header 'Access-Control-Allow-Credentials' 'true';
			add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
			add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
		}
		if ($request_method = 'GET') {
			add_header 'Access-Control-Allow-Origin' '*';
			add_header 'Access-Control-Allow-Credentials' 'true';
			add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
			add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
		}

		allow   10.0.0.0/8;
		allow   72.28.97.160/27;
		allow   173.46.67.88/29;
		deny    all;
	}

}


